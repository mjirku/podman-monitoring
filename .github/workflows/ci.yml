name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate docker-compose.yml
      run: docker compose config

    - name: Validate prometheus.yml
      run: |
        python3 -c "import yaml; yaml.safe_load(open('prometheus.yml'))"

    - name: Check shell scripts
      run: |
        shellcheck socket_fix.sh || true

    - name: Check PowerShell scripts
      run: |
        pwsh -Command "Get-Content socket_fix.ps1 | Out-Null" || true
